<svg xmlns="http://www.w3.org/2000/svg" width="528" height="316" viewBox="0 0 528 316" role="img"
     aria-label="Глубина сущностей-контейнеров в иерархии сущностей: то же дерево Root, x, y, p, c, разбитое пунктирными полосами на уровни глубины 0, 1, 2 и 3">
  <style><![CDATA[
    /* Rossi palette, self-contained so the figure adapts to the reader's color scheme
       even when embedded through an img element (page CSS cannot reach inside). */
    text        { font-family: "PT Sans", system-ui, sans-serif; fill: #352A1A; }
    .fill-node  { fill: #F3ECDB; }
    .ink        { stroke: #352A1A; }
    .ink-fill   { fill: #352A1A; }
    .hairline   { stroke: #D9CCB1; }
    @media (prefers-color-scheme: dark) {
      text       { fill: #E7DEC9; }
      .fill-node { fill: #232016; }
      .ink       { stroke: #E7DEC9; }
      .ink-fill  { fill: #E7DEC9; }
      .hairline  { stroke: #534B39; }
    }
  ]]></style>
  <defs>
    <marker id="ah-ink44" markerWidth="9" markerHeight="7" refX="8" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path class="ink-fill" d="M0,0 L9,3.2 L0,6.4 Z"/>
    </marker>
  </defs>

  <!-- depth bands (dashed hairline), drawn first so the tree sits on top -->
  <g class="hairline" fill="none" stroke-width="1.3" stroke-dasharray="5 3">
    <rect x="24" y="8"   width="380" height="68" rx="2"/>
    <rect x="24" y="84"  width="380" height="68" rx="2"/>
    <rect x="24" y="160" width="380" height="68" rx="2"/>
    <rect x="24" y="236" width="380" height="68" rx="2"/>
  </g>
  <g font-size="15">
    <text x="418" y="47">— глубина 0</text>
    <text x="418" y="123">— глубина 1</text>
    <text x="418" y="199">— глубина 2</text>
    <text x="418" y="275">— глубина 3</text>
  </g>

  <!-- tree edges (same geometry as fig4.3, parent -> child) -->
  <g class="ink" fill="none" stroke-width="1.4" marker-end="url(#ah-ink44)">
    <path d="M250,57 L160,103"/>   <!-- Root -> x -->
    <path d="M250,57 L360,103"/>   <!-- Root -> (elided) -->
    <path d="M160,133 L90,179"/>   <!-- x -> y -->
    <path d="M160,133 L230,179"/>  <!-- x -> p -->
    <path d="M230,209 L180,255"/>  <!-- p -> (elided) -->
    <path d="M230,209 L290,255"/>  <!-- p -> c -->
  </g>

  <!-- tree nodes -->
  <g class="fill-node ink" stroke-width="1.4">
    <rect x="222" y="27"  width="56" height="30" rx="1.5"/>
    <rect x="132" y="103" width="56" height="30" rx="1.5"/>
    <rect x="332" y="103" width="56" height="30" rx="1.5"/>
    <rect x="62"  y="179" width="56" height="30" rx="1.5"/>
    <rect x="202" y="179" width="56" height="30" rx="1.5"/>
    <rect x="152" y="255" width="56" height="30" rx="1.5"/>
    <rect x="262" y="255" width="56" height="30" rx="1.5"/>
  </g>
  <g font-size="15" text-anchor="middle">
    <text x="250" y="47">Root</text>
    <text x="160" y="123">x</text>
    <text x="360" y="123">…</text>   <!-- elided sibling -->
    <text x="90"  y="199">y</text>
    <text x="230" y="199">p</text>
    <text x="180" y="275">…</text>   <!-- elided sibling -->
    <text x="290" y="275">c</text>
  </g>
</svg>
