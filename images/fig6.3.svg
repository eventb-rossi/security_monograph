<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img"
     aria-label="Схема процесса верификации кода модуля LSM: разработка и верификация спецификации интерфейса LSM, затем рекурсивная верификация функций LSM с разработкой и верификацией спецификаций вызываемых функций">
  <style><![CDATA[
    /* Rossi palette, self-contained so the figure adapts to the reader's color scheme
       even when embedded through an img element (page CSS cannot reach inside). */
    text         { font-family: "PT Sans", system-ui, sans-serif; fill: #352A1A; }
    .fill-node   { fill: #F3ECDB; }
    .ink         { stroke: #352A1A; }
    .ink-fill    { fill: #352A1A; }
    .hairline    { stroke: #D9CCB1; }
    .accent      { stroke: #AC532A; }
    .accent-fill { fill: #AC532A; }
    @media (prefers-color-scheme: dark) {
      text         { fill: #E7DEC9; }
      .fill-node   { fill: #232016; }
      .ink         { stroke: #E7DEC9; }
      .ink-fill    { fill: #E7DEC9; }
      .hairline    { stroke: #534B39; }
      .accent      { stroke: #C26A39; }
      .accent-fill { fill: #C26A39; }
    }
  ]]></style>
  <defs>
    <marker id="ah-ink" markerWidth="9" markerHeight="7" refX="8" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path class="ink-fill" d="M0,0 L9,3.2 L0,6.4 Z"/>
    </marker>
    <marker id="ah-acc" markerWidth="10" markerHeight="8" refX="8" refY="3.6"
            orient="auto" markerUnits="userSpaceOnUse">
      <path class="accent-fill" d="M0,0 L10,3.6 L0,7.2 Z"/>
    </marker>
  </defs>

  <!-- 1. top box: verify the LSM interface specification -->
  <rect class="fill-node ink" x="90" y="16" width="300" height="74" rx="2" stroke-width="1.4"/>
  <g font-size="13" text-anchor="middle">
    <text x="240" y="47">Разработка и верификация формальной</text>
    <text x="240" y="68">спецификации интерфейса LSM</text>
  </g>

  <!-- 2. arrow down into the container -->
  <path class="ink" fill="none" stroke-width="1.6" d="M240,90 L240,121" marker-end="url(#ah-ink)"/>

  <!-- 3. container: "Верификация функций LSM" (transparent, hairline border) -->
  <rect class="hairline" fill="none" x="36" y="124" width="408" height="258" rx="3" stroke-width="1.3"/>
  <text x="240" y="147" font-size="13" text-anchor="middle">Верификация функций LSM</text>

  <!-- 4a. recursion ring (rust circular arrow, gap + arrowhead at top) around the inner box -->
  <path class="accent" fill="none" stroke-width="2" d="M256,183 A140,86 0 1 1 224,183"
        marker-end="url(#ah-acc)"/>

  <!-- 4b. inner box: develop & verify specs of the called functions -->
  <rect class="fill-node ink" x="142" y="216" width="196" height="104" rx="2" stroke-width="1.4"/>
  <g font-size="13" text-anchor="middle">
    <text x="240" y="250">Разработка и верификация</text>
    <text x="240" y="270">спецификаций вызываемых</text>
    <text x="240" y="290">из LSM функций</text>
  </g>
</svg>
