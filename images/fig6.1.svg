<svg xmlns="http://www.w3.org/2000/svg" width="660" height="388" viewBox="0 0 660 388" role="img"
     aria-label="Схема работы ядра ОС Linux с модулем LSM: субъект (процесс) инициирует системный вызов, который последовательно проходит проверку параметров, проверки доступа DAC и вызов интерфейса LSM; вызов интерфейса возвращает результат объекту (файлу), обменивается с модулем безопасности через реализацию интерфейса и обращается к структурам данных через механизм арбитража LSM; всё, кроме субъекта и объекта, выполняется внутри ядра Linux">
  <style><![CDATA[
    /* Rossi palette, self-contained so the figure adapts to the reader's color scheme
       even when embedded through an img element (page CSS cannot reach inside). */
    text        { font-family: "PT Sans", system-ui, sans-serif; fill: #352A1A; }
    .fill-node  { fill: #F3ECDB; }
    .ink        { stroke: #352A1A; }
    .ink-fill   { fill: #352A1A; }
    .hairline   { stroke: #D9CCB1; }
    .accent     { stroke: #AC532A; }
    @media (prefers-color-scheme: dark) {
      text      { fill: #E7DEC9; }
      .fill-node{ fill: #232016; }
      .ink      { stroke: #E7DEC9; }
      .ink-fill { fill: #E7DEC9; }
      .hairline { stroke: #534B39; }
      .accent   { stroke: #C26A39; }
    }
  ]]></style>
  <defs>
    <marker id="ah61" markerWidth="9" markerHeight="7" refX="8" refY="3.2"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path class="ink-fill" d="M0,0 L9,3.2 L0,6.4 Z"/>
    </marker>
  </defs>

  <!-- ===== dashed kernel boundary («Ядро Linux») — encloses the stack + the security module ===== -->
  <rect class="hairline" fill="none" x="196" y="12" width="404" height="350" rx="3"
        stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="588" y="32" font-size="14" font-weight="700" text-anchor="end">Ядро Linux</text>

  <!-- ===== central action chain (uniform width) ===== -->
  <g class="fill-node ink" stroke-width="1.4">
    <rect x="215" y="24"  width="170" height="32" rx="2"/>
    <rect x="215" y="88"  width="170" height="32" rx="2"/>
    <rect x="215" y="150" width="170" height="46" rx="2"/>
    <rect x="215" y="232" width="170" height="46" rx="2"/>
    <rect x="215" y="318" width="170" height="32" rx="2"/>
  </g>
  <g font-size="14" text-anchor="middle">
    <text x="300" y="45">Системный вызов</text>
    <text x="300" y="109">Проверка параметров</text>
    <text x="300" y="169">Проверки доступа</text>
    <text x="300" y="187">(DAC)</text>
    <text x="300" y="251">Вызов</text>
    <text x="300" y="269">LSM интерфейса</text>
    <text x="300" y="339">Структуры данных</text>
  </g>

  <!-- ===== external actors (outside the kernel, on the left) ===== -->
  <g class="fill-node ink" stroke-width="1.4">
    <rect x="40" y="20"  width="130" height="40" rx="2"/>
    <rect x="40" y="235" width="130" height="40" rx="2"/>
  </g>
  <g font-size="14" text-anchor="middle">
    <text x="105" y="36">Субъект</text>
    <text x="105" y="54">(процесс)</text>
    <text x="105" y="251">Объект</text>
    <text x="105" y="269">(файл)</text>
  </g>

  <!-- ===== security module (the one rust accent — semantic focus) ===== -->
  <rect class="fill-node accent" x="435" y="232" width="150" height="46" rx="2" stroke-width="1.6"/>
  <g font-size="14" text-anchor="middle">
    <text x="510" y="251">Модуль</text>
    <text x="510" y="269">безопасности</text>
  </g>

  <!-- ===== edges ===== -->
  <g class="ink" fill="none" stroke-width="1.4" marker-end="url(#ah61)">
    <path d="M170,40  L212,40"/>    <!-- субъект -> системный вызов -->
    <path d="M300,56  L300,85"/>    <!-- 1 -> 2 -->
    <path d="M300,120 L300,147"/>   <!-- 2 -> 3 -->
    <path d="M300,196 L300,229"/>   <!-- 3 -> 4 -->
    <path d="M215,255 L173,255"/>   <!-- вызов LSM -> объект (влево) -->
  </g>
  <!-- double-headed: реализация интерфейса & LSM-арбитраж -->
  <g class="ink" fill="none" stroke-width="1.4" marker-start="url(#ah61)" marker-end="url(#ah61)">
    <path d="M385,255 L432,255"/>   <!-- вызов LSM <-> модуль безопасности -->
    <path d="M300,278 L300,315"/>   <!-- вызов LSM <-> структуры данных -->
  </g>

  <!-- ===== arrow labels ===== -->
  <g font-size="13" text-anchor="middle">
    <text x="409" y="210">Реализация</text>
    <text x="409" y="226">интерфейса</text>
    <text x="348" y="293">LSM</text>
    <text x="348" y="309">арбитраж</text>
  </g>
</svg>
