<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img"
     aria-label="Коммутативная диаграмма отношения уточнения R между переходами абстрактной спецификации M1 и детальной спецификации M2">
  <style><![CDATA[
    /* Rossi palette, self-contained so the figure adapts to the reader's color scheme
       even when embedded through an img element (page CSS cannot reach inside). */
    text          { font-family: "PT Sans", system-ui, sans-serif; fill: #352A1A; }
    .ink          { stroke: #352A1A; }
    .ink-fill     { fill: #352A1A; }
    .accent       { stroke: #AC532A; }
    .accent-fill  { fill: #AC532A; }
    .accent-text  { fill: #AC532A; }
    .var          { font-family: "PT Serif", Georgia, serif; font-style: italic; fill: #352A1A; }
    @media (prefers-color-scheme: dark) {
      text         { fill: #E7DEC9; }
      .ink         { stroke: #E7DEC9; }
      .ink-fill    { fill: #E7DEC9; }
      .accent      { stroke: #C26A39; }
      .accent-fill { fill: #C26A39; }
      .accent-text { fill: #C26A39; }
      .var         { fill: #E7DEC9; }
    }
  ]]></style>
  <defs>
    <marker id="ah-ink" markerWidth="9" markerHeight="7" refX="8" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path class="ink-fill" d="M0,0 L9,3.2 L0,6.4 Z"/>
    </marker>
    <marker id="ah-acc" markerWidth="9" markerHeight="7" refX="8" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path class="accent-fill" d="M0,0 L9,3.2 L0,6.4 Z"/>
    </marker>
  </defs>

  <!-- states -->
  <g class="ink" fill="none" stroke-width="1.4">
    <circle cx="80" cy="80" r="24"/>
    <circle cx="400" cy="80" r="24"/>
    <circle cx="80" cy="220" r="24"/>
    <circle cx="400" cy="220" r="24"/>
  </g>
  <g class="var" font-size="22" text-anchor="middle">
    <text x="80" y="88">σ</text>
    <text x="400" y="88">σ′</text>
    <text x="80" y="228">s</text>
    <text x="400" y="228">s′</text>
  </g>

  <!-- M1 / M2 transitions (ink) -->
  <g class="ink" fill="none" stroke-width="1.4">
    <path d="M106,80 L374,80" marker-end="url(#ah-ink)"/>
    <path d="M106,220 L374,220" marker-end="url(#ah-ink)"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="240" y="44">Переход в абстрактной спецификации M1</text>
    <text x="240" y="262">Переход в детальной спецификации М2</text>
  </g>

  <!-- refinement relation R (accent) -->
  <g class="accent" fill="none" stroke-width="1.6">
    <path d="M80,196 L80,106" marker-end="url(#ah-acc)"/>
    <path d="M400,196 L400,106" marker-end="url(#ah-acc)"/>
  </g>
  <g class="accent-text" font-size="16" font-style="italic" text-anchor="middle">
    <text x="62" y="150">R</text>
    <text x="418" y="150">R</text>
  </g>
</svg>
