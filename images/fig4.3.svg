<svg xmlns="http://www.w3.org/2000/svg" width="744" height="316" viewBox="0 0 744 316" role="img"
     aria-label="Путь до корневого каталога от сущности-контейнера c: слева дерево сущностей-контейнеров Root, x, y, p, c; справа путь Root—x—p—c с фигурными скобками, обозначающими множества E = {x, p, c} и Parent[E] = {Root, x, p}">
  <style><![CDATA[
    /* Rossi palette, self-contained so the figure adapts to the reader's color scheme
       even when embedded through an img element (page CSS cannot reach inside). */
    text        { font-family: "PT Sans", system-ui, sans-serif; fill: #352A1A; }
    .fill-node  { fill: #F3ECDB; }
    .ink        { stroke: #352A1A; }
    .ink-fill   { fill: #352A1A; }
    .math       { font-family: "PT Serif", Georgia, serif; font-style: italic; fill: #352A1A; }
    @media (prefers-color-scheme: dark) {
      text       { fill: #E7DEC9; }
      .fill-node { fill: #232016; }
      .ink       { stroke: #E7DEC9; }
      .ink-fill  { fill: #E7DEC9; }
      .math      { fill: #E7DEC9; }
    }
  ]]></style>
  <defs>
    <marker id="ah-ink43" markerWidth="9" markerHeight="7" refX="8" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path class="ink-fill" d="M0,0 L9,3.2 L0,6.4 Z"/>
    </marker>
  </defs>

  <!-- ================= left: the container tree ================= -->
  <g class="ink" fill="none" stroke-width="1.4" marker-end="url(#ah-ink43)">
    <path d="M250,57 L160,103"/>   <!-- Root -> x -->
    <path d="M250,57 L360,103"/>   <!-- Root -> (elided) -->
    <path d="M160,133 L90,179"/>   <!-- x -> y -->
    <path d="M160,133 L230,179"/>  <!-- x -> p -->
    <path d="M230,209 L180,255"/>  <!-- p -> (elided) -->
    <path d="M230,209 L290,255"/>  <!-- p -> c -->
  </g>
  <g class="fill-node ink" stroke-width="1.4">
    <rect x="222" y="27"  width="56" height="30" rx="1.5"/>
    <rect x="132" y="103" width="56" height="30" rx="1.5"/>
    <rect x="332" y="103" width="56" height="30" rx="1.5"/>
    <rect x="62"  y="179" width="56" height="30" rx="1.5"/>
    <rect x="202" y="179" width="56" height="30" rx="1.5"/>
    <rect x="152" y="255" width="56" height="30" rx="1.5"/>
    <rect x="262" y="255" width="56" height="30" rx="1.5"/>
  </g>
  <g font-size="15" text-anchor="middle">
    <text x="250" y="47">Root</text>
    <text x="160" y="123">x</text>
    <text x="360" y="123">…</text>   <!-- elided sibling -->
    <text x="90"  y="199">y</text>
    <text x="230" y="199">p</text>
    <text x="180" y="275">…</text>   <!-- elided sibling -->
    <text x="290" y="275">c</text>
  </g>

  <!-- ================= right: the Root..c path with braces ================= -->
  <g class="ink" fill="none" stroke-width="1.4" marker-end="url(#ah-ink43)">
    <path d="M540,57  L540,103"/>  <!-- Root -> x -->
    <path d="M540,133 L540,179"/>  <!-- x -> p -->
    <path d="M540,209 L540,255"/>  <!-- p -> c -->
  </g>
  <g class="fill-node ink" stroke-width="1.4">
    <rect x="512" y="27"  width="56" height="30" rx="1.5"/>
    <rect x="512" y="103" width="56" height="30" rx="1.5"/>
    <rect x="512" y="179" width="56" height="30" rx="1.5"/>
    <rect x="512" y="255" width="56" height="30" rx="1.5"/>
  </g>
  <g font-size="15" text-anchor="middle">
    <text x="540" y="47">Root</text>
    <text x="540" y="123">x</text>
    <text x="540" y="199">p</text>
    <text x="540" y="275">c</text>
  </g>

  <!-- E = {x, p, c} : inner brace over the lower three -->
  <path class="ink" fill="none" stroke-width="1.4"
        d="M576,103 Q583,103 583,148.5 T590,194 Q583,194 583,239.5 T576,285"/>
  <text class="math" x="604" y="200" font-size="18">E</text>

  <!-- Parent[E] = {Root, x, p} : outer brace over the upper three -->
  <path class="ink" fill="none" stroke-width="1.4"
        d="M620,27 Q627,27 627,72.5 T634,118 Q627,118 627,163.5 T620,209"/>
  <text class="math" x="646" y="124" font-size="18">Parent[E]</text>
</svg>
