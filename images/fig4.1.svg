<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330" role="img"
     aria-label="Структура спецификации на Event-B: контекст (множества, константы, аксиомы) и машина (переменные, инварианты, события); машина использует контекст, другие машины уточняют машину и используют другие контексты, другие контексты расширяют контекст">
  <style><![CDATA[
    /* Rossi palette, self-contained so the figure adapts to the reader's color scheme
       even when embedded through an img element (page CSS cannot reach inside). */
    text        { font-family: "PT Sans", system-ui, sans-serif; fill: #352A1A; }
    .fill-node  { fill: #F3ECDB; }
    .ink        { stroke: #352A1A; }
    .ink-fill   { fill: #352A1A; }
    @media (prefers-color-scheme: dark) {
      text       { fill: #E7DEC9; }
      .fill-node { fill: #232016; }
      .ink       { stroke: #E7DEC9; }
      .ink-fill  { fill: #E7DEC9; }
    }
  ]]></style>
  <defs>
    <marker id="ah-ink41" markerWidth="9" markerHeight="7" refX="8" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path class="ink-fill" d="M0,0 L9,3.2 L0,6.4 Z"/>
    </marker>
  </defs>

  <!-- ================= boxes ================= -->
  <!-- Контекст (top-left): header + member list -->
  <rect class="fill-node ink" x="40" y="30" width="200" height="96" rx="1.5" stroke-width="1.4"/>
  <line class="ink" x1="40" y1="62" x2="240" y2="62" stroke-width="1.4"/>
  <text x="140" y="52" font-size="15" text-anchor="middle">Контекст</text>
  <g font-size="14" text-anchor="middle">
    <text x="140" y="83">Множества</text>
    <text x="140" y="101">Константы</text>
    <text x="140" y="119">Аксиомы</text>
  </g>

  <!-- Машина (top-right): header + member list -->
  <rect class="fill-node ink" x="380" y="30" width="200" height="96" rx="1.5" stroke-width="1.4"/>
  <line class="ink" x1="380" y1="62" x2="580" y2="62" stroke-width="1.4"/>
  <text x="480" y="52" font-size="15" text-anchor="middle">Машина</text>
  <g font-size="14" text-anchor="middle">
    <text x="480" y="83">Переменные</text>
    <text x="480" y="101">Инварианты</text>
    <text x="480" y="119">События</text>
  </g>

  <!-- Другие контексты / Другие машины (bottom row) -->
  <rect class="fill-node ink" x="40" y="250" width="200" height="48" rx="1.5" stroke-width="1.4"/>
  <text x="140" y="279" font-size="14" text-anchor="middle">Другие контексты</text>
  <rect class="fill-node ink" x="380" y="250" width="200" height="48" rx="1.5" stroke-width="1.4"/>
  <text x="480" y="279" font-size="14" text-anchor="middle">Другие машины</text>

  <!-- ================= edges ================= -->
  <g class="ink" fill="none" stroke-width="1.4" marker-end="url(#ah-ink41)">
    <path d="M380,78 L242,78"/>     <!-- Машина -> Контекст (использует) -->
    <path d="M404,126 L224,248"/>   <!-- Машина -> Другие контексты (использует) -->
    <path d="M140,250 L140,128"/>   <!-- Другие контексты -> Контекст (расширяют) -->
    <path d="M480,250 L480,128"/>   <!-- Другие машины -> Машина (уточняют) -->
    <path d="M380,274 L242,274"/>   <!-- Другие машины -> Другие контексты (используют) -->
  </g>

  <!-- ================= edge labels ================= -->
  <g font-size="13">
    <text x="311" y="70"  text-anchor="middle">использует</text>
    <text x="392" y="163" text-anchor="middle">использует</text>
    <text x="95"  y="193" text-anchor="middle">расширяют</text>
    <text x="527" y="193" text-anchor="middle">уточняют</text>
    <text x="311" y="266" text-anchor="middle">используют</text>
  </g>
</svg>
