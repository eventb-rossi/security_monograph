<svg xmlns="http://www.w3.org/2000/svg" width="340" height="510" viewBox="0 0 340 510" role="img"
     aria-label="Графовая модель небольшого подмножества цепочек действий системного вызова open: разбор параметров pathname и flags, проверка наличия прав доступа, получение доступа на запись к родительскому каталогу, создание файла, получение прав доступа к созданному файлу, получение требуемого доступа и возвращение дескриптора; если файл уже существует, цепочка сокращается прямым переходом к получению требуемого доступа">
  <style><![CDATA[
    /* Rossi palette, self-contained so the figure adapts to the reader's color scheme
       even when embedded through an img element (page CSS cannot reach inside). */
    text        { font-family: "PT Sans", system-ui, sans-serif; fill: #352A1A; }
    .fill-node  { fill: #F3ECDB; }
    .ink        { stroke: #352A1A; }
    .ink-fill   { fill: #352A1A; }
    @media (prefers-color-scheme: dark) {
      text       { fill: #E7DEC9; }
      .fill-node { fill: #232016; }
      .ink       { stroke: #E7DEC9; }
      .ink-fill  { fill: #E7DEC9; }
    }
  ]]></style>
  <defs>
    <marker id="ah-ink52" markerWidth="9" markerHeight="7" refX="8" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path class="ink-fill" d="M0,0 L9,3.2 L0,6.4 Z"/>
    </marker>
  </defs>

  <!-- ================= boxes (uniform width, centred; 2-line = 46, 1-line = 34) ================= -->
  <g class="fill-node ink" stroke-width="1.4">
    <rect x="24" y="20"  width="240" height="46" rx="1.5"/>
    <rect x="24" y="92"  width="240" height="46" rx="1.5"/>
    <rect x="24" y="192" width="240" height="46" rx="1.5"/>
    <rect x="24" y="264" width="240" height="34" rx="1.5"/>
    <rect x="24" y="324" width="240" height="46" rx="1.5"/>
    <rect x="24" y="396" width="240" height="34" rx="1.5"/>
    <rect x="24" y="456" width="240" height="34" rx="1.5"/>
  </g>
  <g font-size="14" text-anchor="middle">
    <text x="144" y="39">Разбор параметров</text>
    <text x="144" y="57">pathname и flags</text>

    <text x="144" y="111">Проверка наличия нужных</text>
    <text x="144" y="129">прав доступа — права имеются</text>

    <text x="144" y="211">Получение доступа на запись</text>
    <text x="144" y="229">к родительскому каталогу</text>

    <text x="144" y="285">Создание файла</text>

    <text x="144" y="343">Получение прав доступа</text>
    <text x="144" y="361">к созданному файлу</text>

    <text x="144" y="417">Получение требуемого доступа</text>

    <text x="144" y="477">Возвращение дескриптора</text>
  </g>

  <!-- ================= edges ================= -->
  <g class="ink" fill="none" stroke-width="1.4" marker-end="url(#ah-ink52)">
    <path d="M144,66  L144,90"/>    <!-- 1 -> 2 -->
    <path d="M144,138 L144,190"/>   <!-- 2 -> 3 (файл не существует) -->
    <path d="M144,238 L144,262"/>   <!-- 3 -> 4 -->
    <path d="M144,298 L144,322"/>   <!-- 4 -> 5 -->
    <path d="M144,370 L144,394"/>   <!-- 5 -> 6 -->
    <path d="M144,430 L144,454"/>   <!-- 6 -> 7 -->
    <path d="M264,115 L300,115 L300,413 L266,413"/>  <!-- bypass: 2 -> 6 (файл существует) -->
  </g>

  <!-- ================= branch labels under box 2 ================= -->
  <g font-size="13" text-anchor="middle">
    <text x="82"  y="158">файл не</text>
    <text x="82"  y="175">существует</text>
    <text x="210" y="158">файл</text>
    <text x="210" y="175">существует</text>
  </g>
</svg>
