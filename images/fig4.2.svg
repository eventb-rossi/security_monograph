<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img"
     aria-label="Соответствие между компонентами МРОСЛ ДП-модели и Event-B: структуры данных отображаются в множества, константы, аксиомы и переменные; условия, свойства и требования — в аксиомы и инварианты; состояния — в переменные и инварианты; правила переходов — в события с их параметрами, охранными условиями и действиями">
  <style><![CDATA[
    /* Rossi palette, self-contained so the figure adapts to the reader's color scheme
       even when embedded through an img element (page CSS cannot reach inside). */
    text        { font-family: "PT Sans", system-ui, sans-serif; fill: #352A1A; }
    .fill-node  { fill: #F3ECDB; }
    .ink        { stroke: #352A1A; }
    .ink-fill   { fill: #352A1A; }
    @media (prefers-color-scheme: dark) {
      text       { fill: #E7DEC9; }
      .fill-node { fill: #232016; }
      .ink       { stroke: #E7DEC9; }
      .ink-fill  { fill: #E7DEC9; }
    }
  ]]></style>
  <defs>
    <marker id="ah-ink42" markerWidth="9" markerHeight="7" refX="8" refY="3.2"
            orient="auto" markerUnits="userSpaceOnUse">
      <path class="ink-fill" d="M0,0 L9,3.2 L0,6.4 Z"/>
    </marker>
  </defs>

  <!-- ============ left column: МРОСЛ ДП-model components (rounded, uniform width) ============ -->
  <g class="fill-node ink" stroke-width="1.4">
    <rect x="20" y="20"  width="250" height="40"  rx="7"/>
    <rect x="20" y="74"  width="250" height="40"  rx="7"/>
    <rect x="20" y="128" width="250" height="40"  rx="7"/>
    <rect x="20" y="182" width="250" height="158" rx="7"/>
  </g>
  <g font-size="14">
    <text x="34" y="45">Структуры данных</text>
    <text x="34" y="99">Условия, свойства, требования</text>
    <text x="34" y="153">Состояния</text>
    <text x="34"  y="206">Правила переходов системы</text>
    <text x="34"  y="228">из состояния в состояние:</text>
    <text x="46"  y="250">- параметры;</text>
    <text x="46"  y="272">- ограничения на исходное</text>
    <text x="58"  y="294">состояние;</text>
    <text x="46"  y="316">- ограничения на результирующее</text>
    <text x="58"  y="338">состояние</text>
  </g>

  <!-- ============ right: the Event-B box (sectioned, same height, top/bottom aligned) ============ -->
  <rect class="fill-node ink" x="470" y="20" width="240" height="320" rx="1.5" stroke-width="1.4"/>
  <g class="ink" stroke-width="1.4">
    <line x1="470" y1="60"  x2="710" y2="60"/>
    <line x1="470" y1="130" x2="710" y2="130"/>
    <line x1="470" y1="200" x2="710" y2="200"/>
  </g>
  <text x="590" y="45" font-size="15" text-anchor="middle">Event-B</text>
  <g font-size="14">
    <text x="482" y="88">Множества, константы</text>
    <text x="482" y="112">Аксиомы</text>
    <text x="482" y="158">Переменные</text>
    <text x="482" y="182">Инварианты</text>
    <text x="482" y="226">События:</text>
    <text x="494" y="254">- параметры;</text>
    <text x="494" y="282">- охранные условия;</text>
    <text x="494" y="310">- действия</text>
  </g>

  <!-- ============ mapping arrows (ink, straight) ============ -->
  <g class="ink" fill="none" stroke-width="1.3" marker-end="url(#ah-ink42)">
    <path d="M270,36  L468,92"/>    <!-- Структуры данных -> Множества/константы -->
    <path d="M270,48  L468,150"/>   <!-- Структуры данных -> Переменные (crossing) -->
    <path d="M270,90  L468,106"/>   <!-- Условия… -> Аксиомы (crossing) -->
    <path d="M270,100 L468,168"/>   <!-- Условия… -> Инварианты -->
    <path d="M270,148 L468,180"/>   <!-- Состояния -> Переменные/Инварианты -->
    <path d="M270,261 L468,266"/>   <!-- Правила -> События (single edge) -->
  </g>
</svg>
