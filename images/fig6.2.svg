<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img"
     aria-label="Взаимодействие модуля безопасности с компонентами ядра ОС Linux: подсистемы ядра — виртуальная файловая система (VFS), сетевой стек, управление процессами (PM) и управление памятью (MM), доступные через интерфейс системных вызовов, — вызывают модуль безопасности, который, в свою очередь, вызывает их обратно, а также обращается к библиотечным функциям (строковым, управления памятью и битовых операций); всё выполняется внутри ядра">
  <style><![CDATA[
    /* Rossi palette, self-contained so the figure adapts to the reader's color scheme
       even when embedded through an img element (page CSS cannot reach inside). */
    text        { font-family: "PT Sans", system-ui, sans-serif; fill: #352A1A; }
    .fill-node  { fill: #F3ECDB; }
    .ink        { stroke: #352A1A; }
    .ink-fill   { fill: #352A1A; }
    .hairline   { stroke: #D9CCB1; }
    .accent     { stroke: #AC532A; }
    @media (prefers-color-scheme: dark) {
      text      { fill: #E7DEC9; }
      .fill-node{ fill: #232016; }
      .ink      { stroke: #E7DEC9; }
      .ink-fill { fill: #E7DEC9; }
      .hairline { stroke: #534B39; }
      .accent   { stroke: #C26A39; }
    }
  ]]></style>
  <defs>
    <marker id="ah62" markerWidth="9" markerHeight="7" refX="8" refY="3.2"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path class="ink-fill" d="M0,0 L9,3.2 L0,6.4 Z"/>
    </marker>
  </defs>

  <!-- ===== dashed kernel boundary («Ядро»); label sits in the top margin band ===== -->
  <rect class="hairline" fill="none" x="8" y="8" width="704" height="424" rx="3"
        stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="694" y="28" font-size="14" font-weight="700" text-anchor="end">Ядро</text>

  <!-- ===== system-call interface (top band) ===== -->
  <rect class="fill-node ink" x="40" y="40" width="640" height="32" rx="2" stroke-width="1.4"/>
  <text x="360" y="61" font-size="14" text-anchor="middle">Интерфейс системных вызовов</text>

  <!-- ===== kernel subsystems (row of four) ===== -->
  <g class="fill-node ink" stroke-width="1.4">
    <rect x="40"  y="88" width="148" height="72" rx="2"/>
    <rect x="204" y="88" width="148" height="72" rx="2"/>
    <rect x="368" y="88" width="148" height="72" rx="2"/>
    <rect x="532" y="88" width="148" height="72" rx="2"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="114" y="114">Виртуальная</text>
    <text x="114" y="130">файловая система</text>
    <text x="114" y="146">(VFS)</text>
    <text x="278" y="122">Сетевой</text>
    <text x="278" y="138">стек</text>
    <text x="442" y="114">Управление</text>
    <text x="442" y="130">процессами</text>
    <text x="442" y="146">(PM)</text>
    <text x="606" y="114">Управление</text>
    <text x="606" y="130">памятью</text>
    <text x="606" y="146">(MM)</text>
  </g>

  <!-- ===== security module (the one rust accent — semantic focus) ===== -->
  <rect class="fill-node accent" x="150" y="226" width="420" height="56" rx="2" stroke-width="1.6"/>
  <g font-size="14" text-anchor="middle">
    <text x="360" y="250">Модуль</text>
    <text x="360" y="268">безопасности</text>
  </g>

  <!-- ===== library functions (bottom band) ===== -->
  <rect class="fill-node ink" x="40" y="318" width="640" height="32" rx="2" stroke-width="1.4"/>
  <text x="360" y="339" font-size="14" text-anchor="middle">Библиотечные функции</text>
  <g class="fill-node ink" stroke-width="1.4">
    <rect x="40"  y="364" width="200" height="48" rx="2"/>
    <rect x="260" y="364" width="200" height="48" rx="2"/>
    <rect x="480" y="364" width="200" height="48" rx="2"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="140" y="384">Строковые</text>
    <text x="140" y="400">функции</text>
    <text x="360" y="384">Функции управления</text>
    <text x="360" y="400">памятью</text>
    <text x="580" y="384">Функции битовых</text>
    <text x="580" y="400">операций</text>
  </g>

  <!-- ===== edges: subsystems call the module (down), module calls back (up) ===== -->
  <g class="ink" fill="none" stroke-width="1.4" marker-end="url(#ah62)">
    <path d="M125,160 L205,224"/>   <!-- VFS -> module (diagonal) -->
    <path d="M278,160 L278,224"/>   <!-- Сетевой стек -> module -->
    <path d="M442,160 L442,224"/>   <!-- Управление процессами -> module -->
    <path d="M595,160 L515,224"/>   <!-- Управление памятью -> module (diagonal) -->
    <path d="M172,224 L172,172"/>   <!-- callback (left) -->
    <path d="M548,224 L548,172"/>   <!-- callback (right) -->
    <path d="M360,282 L360,316"/>   <!-- module -> библиотечные функции -->
  </g>
</svg>
